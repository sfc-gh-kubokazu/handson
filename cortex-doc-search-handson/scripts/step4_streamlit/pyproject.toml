[project]
name = "pmda-doc-search-app"
version = "0.1.0"
requires-python = ">=3.11"

# ★ streamlit[snowflake] だけを宣言し、バージョンは指定しません。
#
#   なぜ宣言が必要か
#     dependencies を空にすると uv が作る環境に Streamlit 自体が入らず、
#       Failed to get the version of the Streamlit library.
#     というエラーで起動できません。
#     プリインストール済みでも、宣言は必要です。
#
#   なぜバージョンを指定しないか
#     コンテナランタイムは既定では PyPI にアクセスできません。
#     バージョン指定を書くと、プリインストール済みのものでは条件を
#     満たせない場合に PyPI を見にいくため
#     External Access Integration (EAI) が必要になります。
#     指定しなければランタイム同梱のものがそのまま使われます。
#
#   [snowflake] を付ける理由
#     snowflake-snowpark-python が一緒に入ります。
#     st.connection("snowflake") がこれを使います。
#
#   ★パッケージを追加したい場合（pandas, plotly など）は EAI が必要です。
#     このアプリは追加パッケージ無しで動くように書いてあります。
dependencies = [
    "streamlit[snowflake]"
]
